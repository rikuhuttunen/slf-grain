[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slf-grain"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Riku Huttunen", email = "void@some.where" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "grain",
  "sleeplab-format>=0.4.0",
]

[project.urls]
Documentation = "https://github.com/rikuhuttunen/slf-grain#readme"
Issues = "https://github.com/rikuhuttunen/slf-grain/issues"
Source = "https://github.com/rikuhuttunen/slf-grain"

[tool.hatch.version]
path = "src/slf_grain/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/slf_grain tests}"

[tool.coverage.run]
source_pkgs = ["slf_grain", "tests"]
branch = true
parallel = true
omit = [
  "src/slf_grain/__about__.py",
]

[tool.coverage.paths]
slf_grain = ["src/slf_grain", "*/slf-grain/src/slf_grain"]
tests = ["tests", "*/slf-grain/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
